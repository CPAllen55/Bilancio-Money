<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilancio Money — App</title>
<style>
  :root{ --bg:#05080B; --panel:#0F171F; --hair:rgba(231,238,243,.12); --ink:#E7EEF3; --soft:#8A9BAC; --mint:#00F0A8; --coral:#FF5C72; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:15px; line-height:1.55; }
  .wrap{ max-width:900px; margin:0 auto; padding:32px 20px 80px; }
  h1{ font-size:22px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub{ color:var(--soft); font-size:13.5px; margin:0 0 26px; }
  .card{ background:var(--panel); border:1px solid var(--hair); border-radius:8px; padding:20px; margin-bottom:16px; }
  label{ display:block; font-size:12px; color:var(--soft); margin:10px 0 4px; }
  input{ width:100%; background:#131D26; border:1px solid var(--hair); border-radius:5px; padding:10px; color:var(--ink); font:inherit; }
  button{ font:inherit; font-size:14px; background:var(--mint); color:#04120C; border:none; border-radius:5px; padding:10px 16px; cursor:pointer; font-weight:600; margin-top:14px; }
  button.ghost{ background:transparent; color:var(--ink); border:1px solid var(--hair); font-weight:400; }
  button:disabled{ opacity:.5; cursor:default; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; margin-top:10px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--soft); font-weight:500; padding:8px; border-bottom:1px solid var(--hair); }
  td{ padding:8px; border-bottom:1px solid rgba(231,238,243,.06); }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.num.pos{ color:var(--mint); }
  .msg{ font-size:13px; padding:10px 12px; border-radius:5px; margin-top:12px; }
  .msg.err{ background:rgba(255,92,114,.1); color:var(--coral); border:1px solid rgba(255,92,114,.3); }
  .msg.ok{ background:rgba(0,240,168,.08); color:var(--mint); border:1px solid rgba(0,240,168,.3); }
  .item{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--hair); font-size:13.5px; }
  .item:first-of-type{ border-top:none; }
  .warn{ color:var(--coral); font-size:12.5px; }
  .hidden{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bilancio — connected accounts</h1>
  <p class="sub">The signed-in app. This is the plumbing view: sign in, connect a bank, confirm transactions arrive. The dashboard views get wired to this feed next.</p>

  <section class="card" id="auth-card">
    <strong id="auth-title">Sign in</strong>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="row">
      <button id="login-btn">Sign in</button>
      <button id="signup-btn" class="ghost">Create an account</button>
    </div>
    <div id="auth-msg"></div>
  </section>

  <section class="card hidden" id="app-card">
    <div class="row" style="justify-content:space-between">
      <strong id="who"></strong>
      <button class="ghost" id="logout-btn" style="margin-top:0">Sign out</button>
    </div>
    <div class="row">
      <button id="connect-btn">Connect a bank</button>
      <button id="sync-btn" class="ghost">Sync now</button>
    </div>
    <div id="app-msg"></div>
    <div id="items"></div>
  </section>

  <section class="card hidden" id="tx-card">
    <strong>Transactions</strong>
    <table>
      <thead><tr><th>Date</th><th>Merchant</th><th>Account</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead>
      <tbody id="tx-body"></tbody>
    </table>
  </section>
</div>

<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const money = v => (v < 0 ? '-' : '+') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  async function api(method, path, body){
    const res = await fetch(path, {
      method,
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { detail: data.detail });
    return data;
  }
  function say(where, text, kind){
    const el = $(where);
    el.textContent = '';
    if (!text) return;
    const div = document.createElement('div');
    div.className = 'msg ' + (kind || 'ok');
    div.textContent = text;
    el.appendChild(div);
  }

  async function refresh(){
    const { items } = await api('GET', '/api/items');
    const host = $('items');
    host.textContent = '';
    if (!items.length){
      const p = document.createElement('p');
      p.className = 'sub';
      p.style.margin = '14px 0 0';
      p.textContent = 'No banks connected yet.';
      host.appendChild(p);
    }
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item';
      const left = document.createElement('div');
      left.textContent = (item.institution_name || 'Bank') + ' — ' +
        item.accounts.map(a => a.name + (a.mask ? ' ••' + a.mask : '')).join(', ');
      if (item.error){
        const warn = document.createElement('div');
        warn.className = 'warn';
        warn.textContent = 'Needs attention: ' + item.error.error_code;
        left.appendChild(warn);
      }
      const remove = document.createElement('button');
      remove.className = 'ghost';
      remove.style.marginTop = '0';
      remove.textContent = 'Disconnect';
      remove.onclick = async () => {
        remove.disabled = true;
        try { await api('DELETE', '/api/items/' + item.id); await refresh(); }
        catch (err){ say('app-msg', err.message, 'err'); remove.disabled = false; }
      };
      row.appendChild(left);
      row.appendChild(remove);
      host.appendChild(row);
    });

    const { transactions } = await api('GET', '/api/transactions');
    $('tx-card').classList.toggle('hidden', transactions.length === 0);
    const body = $('tx-body');
    body.textContent = '';
    transactions.slice(0, 50).forEach(t => {
      const tr = document.createElement('tr');
      [t.date, t.merchant, t.accountLabel, t.category].forEach(value => {
        const td = document.createElement('td');
        td.textContent = value;
        tr.appendChild(td);
      });
      const amt = document.createElement('td');
      amt.className = 'num' + (t.amount > 0 ? ' pos' : '');
      amt.textContent = money(t.amount);
      tr.appendChild(amt);
      body.appendChild(tr);
    });
  }

  async function showApp(user){
    $('auth-card').classList.add('hidden');
    $('app-card').classList.remove('hidden');
    $('who').textContent = 'Signed in as ' + user.email;
    await refresh();
  }

  $('login-btn').onclick = async () => {
    try { const { user } = await api('POST', '/api/auth/login', { email: $('email').value, password: $('password').value }); await showApp(user); }
    catch (err){ say('auth-msg', err.message, 'err'); }
  };
  $('signup-btn').onclick = async () => {
    try { const { user } = await api('POST', '/api/auth/signup', { email: $('email').value, password: $('password').value }); await showApp(user); }
    catch (err){ say('auth-msg', err.message, 'err'); }
  };
  $('logout-btn').onclick = async () => { await api('POST', '/api/auth/logout'); location.reload(); };

  $('connect-btn').onclick = async () => {
    try {
      const { link_token } = await api('POST', '/api/link/token');
      if (!window.Plaid){ say('app-msg', 'Plaid Link did not load — check the network tab for cdn.plaid.com.', 'err'); return; }
      window.Plaid.create({
        token: link_token,
        onSuccess: async (publicToken, metadata) => {
          say('app-msg', 'Connecting…');
          try {
            const result = await api('POST', '/api/link/exchange', { public_token: publicToken, institution: metadata.institution });
            const added = result.synced ? result.synced.added : 0;
            say('app-msg', 'Connected ' + (result.institution || 'bank') + ' — ' + added + ' transactions pulled.', 'ok');
            await refresh();
          } catch (err){ say('app-msg', err.message, 'err'); }
        },
        onExit: (err) => { if (err) say('app-msg', 'Link closed: ' + err.error_code, 'err'); }
      }).open();
    } catch (err){ say('app-msg', err.message, 'err'); }
  };

  $('sync-btn').onclick = async () => {
    say('app-msg', 'Syncing…');
    try {
      const { results } = await api('POST', '/api/sync');
      const added = results.reduce((sum, r) => sum + (r.added || 0), 0);
      say('app-msg', added ? added + ' new transactions.' : 'Nothing new.', 'ok');
      await refresh();
    } catch (err){ say('app-msg', err.message, 'err'); }
  };

  api('GET', '/api/auth/me').then(({ user }) => { if (user) showApp(user); }).catch(() => {});
})();
</script>
</body>
</html>
